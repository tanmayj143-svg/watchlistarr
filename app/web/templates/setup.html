{% extends "base.html" %}
{% block title %}First run — Watchlistarr{% endblock %}
{% block content %}
<div class="auth-wrap" style="margin:-40px 0 0; width:100vw; margin-left:calc(-50vw + 50%)">
  <form class="auth" method="post" action="/setup">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="3"/><path d="M7 4v16M17 4v16M2 10h5M2 14h5M17 10h5M17 14h5"/>
        </svg>
      </span>
      <span style="font-size:19px">Watchlistarr</span>
    </div>
    <h1>Create your login</h1>
    <p class="sub">One account, no external sign-in. This is only shown once.</p>
    {% if error %}<div class="hint bad" style="margin-bottom:16px">{{ error }}</div>{% endif %}
    <label class="fld"><span>Username</span>
      <input type="text" name="username" value="admin" autocomplete="username" autofocus required>
    </label>
    <label class="fld"><span>Password</span>
      <input type="password" name="password" autocomplete="new-password" required>
      <div class="help">At least 8 characters. Stored as a salted PBKDF2 hash.</div>
    </label>
    <label class="fld"><span>Confirm password</span>
      <input type="password" name="confirm" autocomplete="new-password" required>
    </label>
    <button class="btn primary" style="width:100%; justify-content:center">Create account &amp; continue</button>
  </form>
</div>
{% endblock %}
