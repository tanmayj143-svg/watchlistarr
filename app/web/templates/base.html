<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Watchlistarr{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ version }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>
{% if user %}
<header class="top">
  <div class="wrap top-inner">
    <a class="brand" href="/">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="3"/><path d="M7 4v16M17 4v16M2 10h5M2 14h5M17 10h5M17 14h5"/>
        </svg>
      </span>
      <span>Watchlistarr<small>ARR-ecosystem request bot</small></span>
    </a>
    <nav class="tabs">
      <a href="/" class="{{ 'on' if active == 'home' }}">Watchlists</a>
      <a href="/settings" class="{{ 'on' if active == 'settings' }}">Settings</a>
    </nav>
    <span class="spacer"></span>
    <span class="pill">v{{ version }}</span>
    <form method="post" action="/logout" style="margin:0">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="btn ghost sm">Sign out</button>
    </form>
  </div>
</header>
{% endif %}
<main class="wrap">
  {% block content %}{% endblock %}
</main>
<script src="/static/app.js?v={{ version }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
